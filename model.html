<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roam in 3D | Vikas Budda</title>
<meta name="description" content="Turn Roam, the desk companion robot, around in 3D.">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#17181b;color:#f2f1ee;font:400 15px/1.4 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 42%,#3b3c42 0%,#26272c 45%,#141518 100%)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.back{color:#c9c9cf;text-decoration:none;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.name{font:700 18px/1 Inter,sans-serif;letter-spacing:-.01em}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px max(20px,env(safe-area-inset-bottom));pointer-events:none}
.bot>*{pointer-events:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:600 14px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(20,20,23,.55);color:#e9e9ee;cursor:pointer;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button.on{background:#f2f1ee;color:#111;border-color:#f2f1ee}
button i{width:14px;height:14px;border-radius:50%}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint{font-size:13px;color:#a2a2aa;transition:opacity .6s}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="c" aria-label="Roam in 3D. Drag to turn it, scroll or pinch to zoom."></canvas>
<div class="top"><a class="back" href="index.html#projects">&larr; Back</a><span class="name">Roam</span><button type="button" id="reset">Reset view</button></div>
<div class="bot">
  <p class="hint" id="hint">Drag to turn. Scroll or pinch to zoom. Double-tap to reset.</p>
  <div class="chips" role="group" aria-label="Colour and mood">
    <button type="button" class="col on" data-col="terracotta"><i style="background:#C9764A"></i>Terracotta</button>
    <button type="button" class="col" data-col="sage"><i style="background:#A8B596"></i>Sage green</button>
    <button type="button" id="spin" class="on">Auto-turn</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="js/roam-model.js"></script>
<script src="js/robot.js"></script>
<script>
{
const cv = document.getElementById('c'), hint = document.getElementById('hint');
if (!window.THREE || !window.RoamStage) { hint.textContent = 'This browser could not start 3D graphics.'; }
else {
  const R = RoamStage.create(cv, { fov: 26, mirror: false });
  if (!R) hint.textContent = 'This browser could not start 3D graphics.';
  else {
    const V = { th: -0.5, ph: 1.25, d: 430, vth: 0, vph: 0 }, T = { th: -0.5, ph: 1.25, d: 430 };
    setTimeout(() => { T.d = V.d = fitD(); }, 0);
    let drag = null, auto = true, idle = 0, pinch = null;
    const target = new THREE.Vector3(0, -6, 0);
    R.headYaw = 0; R.headTilt = 0;
    let shadow = null; if (R.scene) R.scene.traverse(o => { if (o.isMesh && o.geometry && o.geometry.parameters && o.geometry.parameters.width === 190) shadow = o; });
    const fitD = () => 430 * Math.max(1, 0.95 / (innerWidth / innerHeight));
    R.update = function (dt, t) {
      R.root.position.y = -53; R.root.rotation.y = 0;
      idle += dt;
      if (!drag) { T.th += V.vth; T.ph += V.vph; V.vth *= 0.92; V.vph *= 0.92; if (auto && idle > 1.2) T.th += dt * 0.35; }
      T.ph = Math.max(0.12, Math.min(Math.PI - 0.12, T.ph)); T.d = Math.max(220, Math.min(1100, T.d));
      V.th += (T.th - V.th) * 0.15; V.ph += (T.ph - V.ph) * 0.15; V.d += (T.d - V.d) * 0.15;
      const s = Math.sin(V.ph);
      R.camera.position.set(target.x + V.d * s * Math.sin(V.th), target.y + V.d * Math.cos(V.ph), target.z + V.d * s * Math.cos(V.th));
      R.camera.up.set(0, 1, 0); R.camera.lookAt(target); if (shadow) shadow.visible = R.camera.position.y > -40;
      R.headYaw = 0.35 * Math.sin(t * 0.5); R.headTilt = 0.12 * Math.sin(t * 0.37);
      R.look.tx = 0.6 * Math.sin(t * 0.7); R.look.ty = 0.3 * Math.sin(t * 0.5);
    };
    const moods = ['happy', 'curious', 'love', 'surprised', 'wink', 'excited', 'calm'];
    let mi = 0; R.setMood('calm');
    setInterval(() => { R.setMood(moods[mi++ % moods.length]); }, 4200);
    const pts = new Map();
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); drag = { x: e.clientX, y: e.clientY }; idle = 0; hint.style.opacity = 0; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: T.d }; } });
    cv.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); idle = 0;
      if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; T.d = pinch.z * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)); return; }
      if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
      V.vth = -dx * 0.006; V.vph = -dy * 0.006; T.th += V.vth; T.ph += V.vph; });
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) drag = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', e => { e.preventDefault(); T.d *= Math.exp(e.deltaY * 0.0012); idle = 0; }, { passive: false });
    const reset = () => { T.th = -0.5; T.ph = 1.25; T.d = fitD(); V.vth = V.vph = 0; idle = 0; };
    cv.addEventListener('dblclick', reset); document.getElementById('reset').onclick = reset;
    document.querySelectorAll('.col').forEach(b => b.onclick = () => { document.querySelectorAll('.col').forEach(x => x.classList.toggle('on', x === b)); R.setColor(b.dataset.col); });
    const sp = document.getElementById('spin'); sp.onclick = () => { auto = !auto; sp.classList.toggle('on', auto); };
    cv.addEventListener('click', () => { R.setMood('happy'); if (R.gesture) R.gesture('wave'); });
  }
}
}
</script>
</body>
</html>
